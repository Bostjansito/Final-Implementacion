# nginx sirve el frontend y hace de proxy hacia las APIs (mismo origen: el navegador
# nunca accede a bases de datos, Redis ni RabbitMQ). Si un servicio está caído, nginx
# responde 502 y el frontend muestra un mensaje claro.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location /api/productos/ {
    set $destino http://productos:8000;
    rewrite ^/api/productos/(.*)$ /$1 break;
    proxy_pass $destino;
  }
  location /api/clientes/ {
    set $destino http://clientes:8000;
    rewrite ^/api/clientes/(.*)$ /$1 break;
    proxy_pass $destino;
  }
  location /api/prestamos/ {
    set $destino http://prestamos:8000;
    rewrite ^/api/prestamos/(.*)$ /$1 break;
    proxy_pass $destino;
  }
  location /api/inventario/ {
    set $destino http://inventario:8000;
    rewrite ^/api/inventario/(.*)$ /$1 break;
    proxy_pass $destino;
  }

  location / {
    try_files $uri /index.html;
  }
}
